name: Daily HK Job Scrape

on:
  schedule:
    - cron: '0 21 * * *'  # 9pm UTC = 5am HKT
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hk-job-aggregator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: hk-job-aggregator/requirements.txt

      - name: Install dependencies
        run: |
          echo "::group::pip install"
          pip install -r requirements.txt
          echo "::endgroup::"

      - name: Scrape jobs
        id: scrape
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "::group::Scraping jobs (Greenhouse + Workday)"
          echo "Started at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          python scrape_all.py
          echo "::endgroup::"

      - name: Score new jobs
        id: score
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "::group::AI scoring (Claude Haiku)"
          echo "Started at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          python matcher.py
          echo "::endgroup::"

      - name: Warn if scorer failed
        if: steps.score.outcome == 'failure'
        run: echo "::warning::Matcher failed or API key missing — email will show unscored table only"

      - name: Send digest email
        id: email
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          echo "::group::Sending email digest"
          echo "Started at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          python emailer.py
          echo "::endgroup::"

      - name: Notify on failure
        if: failure()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SCRAPE_STATUS: ${{ steps.scrape.outcome }}
          SCORE_STATUS:  ${{ steps.score.outcome }}
          EMAIL_STATUS:  ${{ steps.email.outcome }}
        run: |
          python - <<'EOF'
          import os, smtplib
          from email.mime.text import MIMEText
          gmail   = os.environ["GMAIL_ADDRESS"]
          pw      = os.environ["GMAIL_APP_PASSWORD"]
          recipients = [a.strip() for a in os.environ.get("NOTIFY_EMAIL","").split(",") if a.strip()]
          body = (
            f"HK Job Aggregator pipeline FAILED.\n\n"
            f"  Scrape : {os.environ.get('SCRAPE_STATUS')}\n"
            f"  Score  : {os.environ.get('SCORE_STATUS')}\n"
            f"  Email  : {os.environ.get('EMAIL_STATUS')}\n\n"
            f"Check the Actions tab for details."
          )
          msg = MIMEText(body)
          msg["Subject"] = "[HK Jobs] ⚠ Pipeline failed"
          msg["From"] = gmail
          msg["To"] = ", ".join(recipients)
          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
            s.login(gmail, pw)
            s.sendmail(gmail, recipients, msg.as_string())
          print("Failure notification sent.")
          EOF

      - name: Write job summary
        if: always()
        env:
          SCRAPE_STATUS: ${{ steps.scrape.outcome }}
          SCORE_STATUS:  ${{ steps.score.outcome }}
          EMAIL_STATUS:  ${{ steps.email.outcome }}
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## HK Job Digest — $(date -u '+%d %b %Y %H:%M UTC')

          | Step | Status |
          |------|--------|
          | Scrape jobs | $SCRAPE_STATUS |
          | AI scoring  | $SCORE_STATUS |
          | Email digest | $EMAIL_STATUS |

          > Ran at $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          EOF
